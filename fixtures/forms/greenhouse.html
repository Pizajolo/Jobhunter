<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Senior Product Manager, AI Platform at Lumen Robotics</title></head><body>
<main>
<h1>Senior Product Manager, AI Platform</h1><p>Lumen Robotics · Zurich</p>
<form id="application_form" action="#" method="post">
  <h2>Apply for this job</h2>
  <div><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" name="job_application[email]" required></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel" name="job_application[phone]"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" type="file" name="job_application[resume]" required></div>
  <div><label for="cover_letter">Cover Letter</label><input id="cover_letter" type="file" name="job_application[cover_letter]"></div>
  <div><label for="q_linkedin">LinkedIn Profile</label><input id="q_linkedin" name="job_application[answers][0]"></div>
  <div><label for="q_why">Why do you want to work at Lumen Robotics? *</label><textarea id="q_why" name="job_application[answers][1]" required></textarea></div>
  <div><label for="q_salary">What are your salary expectations?</label><input id="q_salary" name="job_application[answers][2]"></div>
  <div><label for="q_auth">Are you legally authorized to work in Switzerland? *</label>
    <select id="q_auth" name="job_application[answers][3]" required><option value="">Please select</option><option>Yes</option><option>No</option></select></div>
  <button type="submit">Submit Application</button>
</form>
</main><script src="_submit.js"></script></body></html>
