<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Head of Product @ Tejo Analytics</title></head><body>
<main>
<h1>Head of Product</h1>
<form action="#">
  <div><label for="_systemfield_name">Name<span aria-hidden="true">*</span></label><input id="_systemfield_name" name="_systemfield_name" required></div>
  <div><label for="_systemfield_email">Email<span aria-hidden="true">*</span></label><input id="_systemfield_email" type="email" name="_systemfield_email" required></div>
  <div><label for="_systemfield_resume">Resume<span aria-hidden="true">*</span></label><input id="_systemfield_resume" type="file" name="_systemfield_resume" required></div>
  <div><label for="q1">What is your notice period?</label><input id="q1" name="q1"></div>
  <fieldset><legend>How did you hear about us?</legend>
    <label><input type="radio" name="q2" value="Job board">Job board</label>
    <label><input type="radio" name="q2" value="Referral">Referral</label>
    <label><input type="radio" name="q2" value="Other">Other</label></fieldset>
  <button type="submit">Submit Application</button>
</form>
</main><script src="_submit.js"></script></body></html>
