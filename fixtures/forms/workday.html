<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Founding Product Manager - Meridian Works Careers</title>
<style>.step{display:none}.step.active{display:block}</style></head><body>
<main>
<h1>Founding Product Manager</h1>
<form id="wd" action="#">
  <section class="step active" data-step="1" aria-label="My Information">
    <h2>My Information</h2>
    <label for="fn">Given Name(s) *</label><input id="fn" name="firstName" required>
    <label for="ln">Family Name *</label><input id="ln" name="lastName" required>
    <label for="em">Email Address *</label><input id="em" type="email" name="email" required>
    <label for="ph">Phone Number</label><input id="ph" name="phone">
    <button type="button" class="next">Save and Continue</button>
  </section>
  <section class="step" data-step="2" aria-label="My Experience">
    <h2>My Experience</h2>
    <label for="cv">Upload resume *</label><input id="cv" type="file" name="resume" required>
    <button type="button" class="next">Save and Continue</button>
  </section>
  <section class="step" data-step="3" aria-label="Application Questions">
    <h2>Application Questions</h2>
    <label for="np">What is your notice period? *</label><input id="np" name="notice" required>
    <button type="button" class="next">Save and Continue</button>
  </section>
  <section class="step" data-step="4" aria-label="Review">
    <h2>Review</h2><p>Please review your application before submitting.</p>
    <button type="submit">Submit</button>
  </section>
</form>
</main>
<script>
document.querySelectorAll('.next').forEach((b) => b.addEventListener('click', () => {
  const cur = document.querySelector('.step.active');
  const missing = [...cur.querySelectorAll('[required]')].filter((el) => el.type === 'file' ? el.files.length === 0 : !el.value);
  if (missing.length) return;
  cur.classList.remove('active');
  cur.nextElementSibling.classList.add('active');
}));
</script><script src="_submit.js"></script></body></html>
