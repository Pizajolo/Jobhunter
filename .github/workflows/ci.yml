name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:prompts
      - run: pnpm eval:email
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @jobhunter/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  docker:
    # Builds the server image (not pushed) so Dockerfile changes are checked on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: jobhunter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name jh -p 127.0.0.1:4317:4317 -e JOBHUNTER_MASTER_KEY=ci-only-master-key-0123456789 jobhunter:ci
          for i in $(seq 1 30); do curl -fs 127.0.0.1:4317/api/health && break; sleep 2; done
          curl -fs 127.0.0.1:4317/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:4317/api/settings)" = 401
          docker exec jh claude --version
          docker logs jh | grep -q "setup code"
